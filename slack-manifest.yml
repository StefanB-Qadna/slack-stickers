display_information:
  name: Stickers
  description: Send your workspace's custom emoji as big stickers
  long_description: "Custom emoji look tiny in a conversation. Stickers posts them as large images instead, the same way GIFs show up. Run /sticker to open a picker with every custom emoji in the workspace, search it, and send the one you want. If you know the name, type /sticker followed by part of it, for example /sticker party. Small typos are fine. You always see a private preview first, and nothing is posted until you press Send. Stickers only reads the list of custom emoji. It does not read messages and does not need to join channels."
  background_color: "#4a154b"
features:
  bot_user:
    display_name: Stickers
    always_online: false
  slash_commands:
    - command: /sticker
      url: https://your-app.vercel.app/api/slack/command
      description: Post a custom emoji as a big sticker
      usage_hint: "[emoji name], random, or help"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - emoji:read
settings:
  interactivity:
    is_enabled: true
    request_url: https://your-app.vercel.app/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
