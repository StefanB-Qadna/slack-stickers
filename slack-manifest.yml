display_information:
  name: Stickers
  description: Send your workspace's custom emoji as big stickers
  long_description: "Custom emoji look tiny in a conversation. Stickers posts them as large images instead, the same way GIFs show up. Type /sticker followed by part of an emoji name, for example /sticker party. You get a private preview that only you can see. Browse other matches with Next match, then press Send to post the sticker to the channel. Run /sticker with no name for a random pick, or /sticker help for usage tips. Stickers only reads the list of custom emoji. It does not read messages and does not need to join channels."
  background_color: "#4a154b"
features:
  bot_user:
    display_name: Stickers
    always_online: false
  slash_commands:
    - command: /sticker
      url: https://slack-stickers.vercel.app/api/slack/command
      description: Post a custom emoji as a big sticker
      usage_hint: "[emoji name] or help"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - emoji:read
settings:
  interactivity:
    is_enabled: true
    request_url: https://slack-stickers.vercel.app/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
